[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmforge"
version = "0.1.0"
description = "Autonomous multi-agent software development orchestrator (Chinese open models via DeepInfra)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50", "pandas>=2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-xdist>=3.5"]
# agent developer tools in `sandbox.mode: local` (the Docker sandbox image already has them);
# after installing, run `python -m playwright install chromium`
tools = ["ruff>=0.6", "mypy>=1.11", "playwright>=1.45"]

[project.scripts]
swarmforge = "swarmforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swarmforge = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: end-to-end runs of the whole fake swarm (skip with -m \"not slow\" while iterating)"]
