# SwarmForge configuration. Copy to swarmforge.yaml and adjust.
# Secrets are NOT stored here: providers name the environment variable that holds the key
# (put it in a .env file next to this config, see .env.example).

providers:
  deepinfra:
    base_url: https://api.deepinfra.com/v1/openai
    api_key_env: DEEPINFRA_API_KEY
    # Public model listing incl. per-token prices; used for cost *estimates* and `swarmforge check`.
    pricing_url: https://api.deepinfra.com/v1/openai/models

# Any role can use any model; one model may serve several roles.
# Model ids must exactly match DeepInfra's catalogue (run `swarmforge check` to verify).
roles:
  planner:              # Engineering Manager: analysis, task graph, corrective planning
    provider: deepinfra
    model: Qwen/Qwen3.5-397B-A17B
    fallback_models: [Qwen/Qwen3.8-Max, Qwen/Qwen3-235B-A22B-Instruct-2507]   # used if the main model stays busy
    temperature: 0.2
    max_steps: 30
    timeout_s: 900
    max_output_tokens: 16384
  developer_backend:    # general / backend developer
    provider: deepinfra
    model: deepseek-ai/DeepSeek-V4-Pro
    fallback_models: [deepseek-ai/DeepSeek-V4-Flash]   # used if the main model stays busy
    temperature: 0.2
    max_steps: 45
    timeout_s: 1200
    max_output_tokens: 16384
  developer_frontend:   # general / frontend developer, runs concurrently with backend
    provider: deepinfra
    model: moonshotai/Kimi-K2.6
    fallback_models: [deepseek-ai/DeepSeek-V4-Flash]   # used if the main model stays busy
    temperature: 0.3
    max_steps: 45
    timeout_s: 1200
    max_output_tokens: 16384
  reviewer:             # independent reviewer - must differ from every developer model
    provider: deepinfra
    model: zai-org/GLM-5.3
    fallback_models: [zai-org/GLM-5.2]   # used if the main model stays busy
    temperature: 0.1
    max_steps: 45
    timeout_s: 900
    max_output_tokens: 16384
  tester:               # test engineer: writes acceptance tests, maps criteria -> tests, files defects
    provider: deepinfra
    model: MiniMaxAI/MiniMax-M3
    fallback_models: [deepseek-ai/DeepSeek-V4-Flash]   # used if the main model stays busy
    temperature: 0.2
    max_steps: 40
    timeout_s: 3600           # writes + runs tests; slow test suites need more time
    max_output_tokens: 16384

  librarian:            # distills Zettelkasten notes after each run (optional; falls back to planner)
    provider: deepinfra
    model: deepseek-ai/DeepSeek-V4-Flash
    fallback_models: [Qwen/Qwen3.8-Flash]   # used if the main model stays busy
    temperature: 0.2
    max_steps: 12
    timeout_s: 600
    max_output_tokens: 8192

  chat:                 # used by `swarmforge ask` and the dashboard Chat page; falls back to planner when absent
    provider: deepinfra
    model: deepseek-ai/DeepSeek-V4-Flash
    temperature: 0.2
    max_output_tokens: 4096

developer_roles: [developer_backend, developer_frontend]

# Thinking level for reasoning models: none | low | medium | high. DeepInfra defaults reasoning
# models to high (slow, expensive); override per role with roles.<role>.reasoning_effort.
reasoning_effort: medium

limits:
  budget_usd: 20.0            # hard stop for the whole run (provider-reported + estimated cost)
  max_runtime_s: 21600        # wall clock for the whole run (6 h); also settable per run in the dashboard
  busy_wait_s: 900            # keep retrying a busy model (HTTP 429/503) this long, then use its fallback_models
  same_repo: coordinate       # several runs per repo: a manager checks they're different enough; each
                              # works on its own branch, is updated with main before its PR (or: serial | parallel)
  max_concurrent_agents: 2    # coding agents running at the same time
  max_repair_cycles: 3        # test/review -> fix iterations
  tester_every_cycle: false   # repair cycles re-run the tests but skip the tester agent (saves ~10 min/cycle)
  max_tasks: 8
  max_conflict_resolutions: 3
  task_retries: 1
  max_planning_attempts: 2

sandbox:
  mode: docker                # docker (recommended) | local (UNSANDBOXED, last resort)
  image: swarmforge-sandbox:latest
  base_image: python:3.12-slim   # used by `swarmforge sandbox build`
  network: none               # agents' commands get no network
  memory: 2g
  cpus: "2"
  pids_limit: 256
  command_timeout_s: 300

project:
  # Executed by the orchestrator (not by an LLM) to produce test evidence. pytest gets
  # --junitxml added automatically for per-test results.
  test_command: python -m pytest -q

github:
  token_env: GITHUB_TOKEN     # falls back to `gh auth token` if gh is installed and logged in
  branch_prefix: swarmforge/  # every pushed branch starts with this; protected names are refused
  require_push_approval: true # ask before pushing / opening the draft PR
  create_pr: true

review:
  blocking_severities: [critical, major]
  allow_same_model_review: false

knowledge:                    # Zettelkasten shared by all runs (Obsidian-compatible Markdown)
  enabled: true
  vault: knowledge            # folder relative to this config file
  librarian_role: librarian
  max_notes_in_prompt: 6      # most relevant notes given to planner (fewer to developers/reviewer)
  max_notes_per_run: 6        # cap on notes the librarian writes per run

self_heal:                    # when a run fails: diagnose why, then retry with more effort
  enabled: true
  max_attempts: 2             # automatic retries per task (0 = never); per task in the dashboard too
  time_factor: 1.5            # each retry gets 1.5x the time, 2.25x on the 2nd retry, ...
  budget_factor: 1.5          # ... the budget ...
  extra_repair_cycles: 1      # ... one more repair cycle ...
  steps_factor: 1.5           # ... and 1.5x the agent steps per session
  max_total_budget_usd: 0     # cap for a task plus its retries; 0 = 3x the task's budget
  diagnose: true              # ask a model why a run failed (one cheap call); stored under Failures
  diagnosis_role: planner

approval:
  timeout_s: 3600             # dashboard approval requests auto-decline after this long

chat:                   # chatbot per-conversation context window (top-level; not the roles.chat role)
  context_max_messages: 12   # newest N messages of a conversation kept in the prompt
  context_max_tokens: 4000  # estimated-token budget for the conversation history

# `swarmforge watch`: label a GitHub issue to hand it to the swarm. It is queued, labelled
# swarmforge:queued -> working -> done/failed, and gets a comment with the summary and the draft PR.
watch:
  repos: []            # owner/name of each repository to watch
  label: swarmforge
  interval_s: 120
  approval: dashboard       # dashboard = ask before pushing; yes = push the draft PR automatically
  comment: true

# Agent variant (from `swarmforge variants`) applied to every run; set with `swarmforge variants use ID`.
# active_variant: v3

# Pi (pi.dev) harness for roles with `runtime: pi`. Pi runs inside the sandbox container and reaches
# the models only through SwarmForge's relay on this machine (the API key never enters the container).
# Set runtime: pi on a developer role to use it.
pi:
  command: pi
  network: bridge         # Pi's container needs to reach the relay; use runtime: builtin for no-network agents
  # relay_host: 0.0.0.0   # uncomment if Pi can't reach the relay through Docker Desktop

# Where clones, worktrees, transcripts, logs and the SQLite DB live.
workdir: ~/.swarmforge
